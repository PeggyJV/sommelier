project_name: sommelier

env:
  # Require use of Go modules.
  - GO111MODULE=on
  # Build a fully static binary. With cgo enabled the release picks up the
  # glibc symbol versions of whatever runner image built it: moving off the
  # retired ubuntu-20.04 image raised the floor to GLIBC_2.34, which made
  # v10.0.0 refuse to start on Debian 11 / Ubuntu 20.04 validators (glibc
  # 2.31) -- every Foundation node included. Static linking removes the
  # dependency on the builder's glibc entirely.
  - CGO_ENABLED=0

builds:
  - id: "sommelier"
    main: ./cmd/sommelier/main.go
    ldflags:
      - -X github.com/cosmos/cosmos-sdk/version.Name=sommelier -X github.com/cosmos/cosmos-sdk/version.AppName=sommelier -X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }} -X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }} -X github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: SHA256SUMS-{{.Version}}.txt
  algorithm: sha256

release:
  name_template: "Release {{.Version}}"

archives:
  - files:
    - LICENSE
    - README.md